name: Windows x86 and x64 build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lister:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S . -B build64 -G "Visual Studio 17 2022" -A x64
      - name: Build x64
        run: cmake --build build64 --config Release --target XRayTHMLister XRayTHMEditor thm_info test_document test_decoder test_texture test_safe_file
      - name: Test parser
        run: ctest --test-dir build64 -C Release --output-on-failure
      - name: Configure x86
        run: cmake -S . -B build32 -G "Visual Studio 17 2022" -A Win32
      - name: Build x86
        run: cmake --build build32 --config Release --target XRayTHMLister XRayTHMEditor test_document test_decoder test_texture test_safe_file
      - name: Test x86
        run: ctest --test-dir build32 -C Release --output-on-failure
      - name: Package Lister
        shell: powershell
        run: ./package_lister.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: XRayTHMTools-v0.4.0-beta
          path: |
            dist/XRayTHMTools*.zip
            dist/XRayTHMTools*.sha256
